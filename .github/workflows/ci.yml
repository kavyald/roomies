name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Public repo (DEPLOYMENT §8): no pull_request_target and no secrets here, since a fork's PR runs it.
permissions:
  contents: read

jobs:
  source:
    name: source (PRs into main come from staging)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The refs go through env, never into the script text (a branch name is untrusted input).
      - run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/pr-source.ts
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}

  fast:
    name: fast (typecheck, lint, unit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  full:
    name: full (database + end-to-end on local Supabase)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Local Supabase in Docker (TESTING.md §5); services the tests don't use stay off.
      - run: pnpm supabase start -x studio,logflare,vector,imgproxy,edge-runtime,storage-api,supavisor
      - run: node scripts/env-local.mjs
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm test:db
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
