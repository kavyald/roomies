name: CI

# One run per change: a branch's pushes run through its PR, and tags (archive/*) run nothing.
# workflow_dispatch runs it by hand on a branch with no PR (`gh workflow run CI --ref <branch>`).
on:
  push:
    branches: [staging, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Public repo (DEPLOYMENT §8): no pull_request_target and no secrets here, since a fork's PR runs it.
permissions:
  contents: read

jobs:
  source:
    name: source (PRs into main come from staging)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The refs go through env, never into the script text (a branch name is untrusted input).
      - run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/pr-source.ts
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}

  fast:
    name: fast (typecheck, lint, unit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  full:
    name: full (database + end-to-end on local Supabase)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Local Supabase in Docker (TESTING.md §5); services the tests don't use stay off.
      - run: pnpm supabase start -x studio,logflare,vector,imgproxy,edge-runtime,storage-api,supavisor
      - run: node scripts/env-local.mjs
      # WebKit is cached per Playwright version; the system libraries come from apt every run.
      # A stalled download once held the job for its full 30 minutes, hence the step timeout.
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps webkit
        timeout-minutes: 5
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps webkit
        timeout-minutes: 5
      - run: pnpm test:db
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
